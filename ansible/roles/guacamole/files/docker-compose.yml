---

version: '3.2'
networks:
  exo-guac-net:
    driver: bridge
services:
  exo-watchtower:
    image: 'registry.gitlab.com/exosphere/exosphere/containrrr/watchtower'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_LABEL_ENABLE: 'true'
      WATCHTOWER_CLEANUP: 'true'
  # Guacamole pinned to 1.6.0 (upstream Docker Hub images): the first release
  # that resizes VNC sessions to the browser window (GUACAMOLE-1196). The
  # exosphere registry mirror is still on 1.5.5.
  exo-guac-guacd:
    image: 'guacamole/guacd:1.6.0'
    restart: 'always'
    hostname: 'guacd'
    networks:
      exo-guac-net:
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
  exo-guac-guacamole:
    image: 'guacamole/guacamole:1.6.0'
    restart: 'always'
    networks:
      exo-guac-net:
    depends_on:
      - 'exo-guac-guacd'
    links:
      - 'exo-guac-guacd:guacd'
    environment:
      GUACD_HOSTNAME: 'guacd'
      GUACAMOLE_HOME: '/config'
    volumes:
      - type: 'bind'
        source: './config'
        target: '/config'
    ports:
      - '49528:8080'
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
