---

support_install_dir: "/opt/instance-config-support"

# Share mode (storage_mode=share, MorphoCloudWorkflow STORAGE_REDESIGN_PLAN.md)
# passes slicer_install_dir=/opt/slicer and slicer_default_scene_path as extra
# vars; these defaults are the volume layout.
slicer_install_dir: "/media/volume/MyData"
slicer_default_scene_path: "/media/volume/MyData"

slicer_version:
  major: 5
  minor: 12
  patch: 4

slicer_python_version: 3.12

# slicer_release_id: "{{ slicer_version['major'] }}.{{ slicer_version['minor'] }}.{{ slicer_version['patch'] }}"
slicer_release_id: "34645"

slicer_extensions:
  - SlicerMorph
  - SurfaceWrapSolidify
  - PyTorch
  - Photogrammetry
  - MorphoDepot
  - NNInteractive
  - DenseCorrespondenceAnalysis
  - SurfaceMarkup
