---

- name: 'operating system-specific variables imported'
  include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_version }}.yml"
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/vars"

- name: 'graphical environment installed'
  package:
    name: '{{ desktop_environment_package_names }}'
    state: 'present'
  # This stuff waits for APT/dpkg lock if unattended upgrades are running
  register: 'apt_status'
  until: 'apt_status is success'
  delay: 10
  retries: 60

- name: 'Ensure apt ffmpeg package is not installed'
  apt:
    name: ffmpeg
    state: absent
  become: true

- name: 'Download ffmpeg static binary (x64)'
  get_url:
    url: 'https://github.com/eugeneware/ffmpeg-static/releases/download/b6.0/ffmpeg-linux-x64'
    dest: '/usr/local/bin/ffmpeg'
    owner: 'root'
    group: 'root'
    mode: '0755'
    force: yes
  when: ansible_architecture == 'x86_64'
  become: true

# https://askubuntu.com/questions/1048774/disabling-lock-screen-18-04
# https://people.gnome.org/~pmkovar/system-admin-guide/screen-locking.html
# https://askubuntu.com/questions/967842/how-to-remove-phone-style-gnome-swipe-to-unlock/1159085#1159085
- name: 'Automatic login enabled in GDM custom config'
  blockinfile:
    path: '{{ gdm_custom_conf_location }}'
    block: |
      AutomaticLoginEnable = true
      AutomaticLogin = {{ desktop_user }}
    insertafter: '\[daemon\]'

- when: guac_enabled | default(false) == false
  name: Configure GDM on the console session
  block:
    - name: 'graphical environment started on boot'
      systemd:
        name: 'graphical.target'
        enabled: 'yes'

    - name: 'graphical environment set as default systemd target'
      command: 'systemctl set-default graphical.target'

    - name: 'graphical environment isolated'
      command: 'systemctl isolate graphical.target'

- name: 'User dconf profile created'
  lineinfile:
    line: '{{ item }}'
    path: '/etc/dconf/profile/user'
    create: 'yes'
    state: 'present'
  loop:
    - 'user-db:user'
    - 'system-db:local'

- name: 'dconf directories created'
  file:
    path: '{{ item }}'
    state: 'directory'
  with_items:
    - '/etc/dconf/db/local.d'
    - '/etc/dconf/db/local.d/locks'

- name: 'Screen lock disabled'
  template:
    src: '00-screenlock.j2'
    dest: '/etc/dconf/db/local.d/00-screenlock'

- name: 'User preferences overridden for screen lock'
  template:
    src: 'screenlock.j2'
    dest: '/etc/dconf/db/local.d/locks/screensaver'

# MorphoCloud: the desktop background is the MorphoCloud logo, centred on
# light gray (the same image and color as the Kubernetes desktop). A default,
# not a lock: a member can still choose another background.
- name: 'MorphoCloud backgrounds directory created'
  file:
    path: '/usr/share/backgrounds/morphocloud'
    state: 'directory'
    mode: '0755'

- name: 'MorphoCloud logo installed'
  copy:
    src: 'MC_Logo.png'
    dest: '/usr/share/backgrounds/morphocloud/MC_Logo.png'
    mode: '0644'

- name: 'Desktop background set to the MorphoCloud logo'
  template:
    src: '00-morphocloud-background.j2'
    dest: '/etc/dconf/db/local.d/00-morphocloud-background'

# MorphoCloud: Slicer first in the sidebar. The Jetstream2 image's
# 00-favorites.js2 sets the list; this file sorts after it, so its list is the
# one used. The rest is the image's list unchanged. A launcher that is not
# installed is not shown.
- name: 'Slicer added to the sidebar'
  template:
    src: '01-morphocloud-favorites.j2'
    dest: '/etc/dconf/db/local.d/01-morphocloud-favorites'

# MorphoCloud: desktop icons from the top-left, by name. Ubuntu's session-only
# default is the bottom-right corner, by name descending (see the template).
- name: 'Desktop icons start at the top-left'
  template:
    src: '02-morphocloud-desktop-icons.j2'
    dest: '/etc/dconf/db/local.d/02-morphocloud-desktop-icons'

- name: 'dconf database updated'
  command: 'dconf update'

- name: 'polkit rules.d directory created'
  file:
    path: '/etc/polkit-1/rules.d'
    state: 'directory'

- name: 'polkit rule written to not prompt desktop user for passphrase for administrative actions'
  template:
    src: '49-nopasswd_global.rules.j2'
    dest: '/etc/polkit-1/rules.d/49-nopasswd_global.rules'

- name: 'operating system specific tasks imported'
  include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_distribution }}-{{ ansible_distribution_version }}.yml"
        - "{{ ansible_distribution }}-{{ ansible_distribution_major_version }}.yml"
        - "{{ ansible_distribution }}.yml"
        - "{{ ansible_os_family }}.yml"
      paths:
        - "{{ role_path }}/tasks"
      skip: true
