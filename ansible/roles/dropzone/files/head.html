<!-- MorphoCloud drop zone: strip the copyparty UI to the essentials.
     Injected into every page via `html-head: %@/opt/dropzone/head.html`
     (the % makes copyparty render it as jinja so the script nonce works).
     Page roots: #ht_spl = login/control panel, #ht_brw = file browser,
     #ht_msg = message pages (e.g. wrong password). -->
<style>
/* ---- login page ---- */
#ht_spl #a, #ht_spl #v, #ht_spl #b, #ht_spl #msg, #ht_spl #cc, #ht_spl .agr,
#ht_spl h1#l, #ht_spl #f, #ht_spl #g, #ht_spl #aa, #ht_spl #ae, #ht_spl #repl, #ht_spl #pb {
  display: none !important;
}
#ht_spl #wrap { max-width: 30em !important; margin: 5em auto 0 !important; }
#ht_spl #lf::before {
  content: "MorphoCloud upload";
  display: block; font-size: 1.8em; margin-bottom: .2em;
}
#ht_spl #lf::after {
  content: "Enter the passphrase from your instance email, then drop files or folders onto the page.";
  display: block; margin-top: 1em; opacity: .75; line-height: 1.4;
}
#ht_spl #lp { width: 100%; box-sizing: border-box; font-size: 1.1em; margin: .6em 0; }
#ht_spl #ls { font-size: 1.1em; }

/* ---- wrong-password page ---- */
#ht_msg #box { max-width: 30em; margin: 5em auto 0; padding: 1em 1.5em; }
#ht_msg #box h1 { font-size: 0; }
#ht_msg #box h1::before {
  content: "That passphrase did not match";
  font-size: 1.6rem;
}
#ht_msg #box h2 { font-size: 1.1em; font-weight: normal; }
#ht_msg #box h2::before { content: "Check the email and "; }
#ht_msg #box h2 a::before { content: "try again"; }
#ht_msg #box h2 a { font-size: 0; }
#ht_msg #box h2 a::before { font-size: 1.1rem; }

/* ---- file browser ---- */
#ht_brw #ops > a:not(#opa_up):not(#opa_mkd) { display: none !important; }
#ht_brw #u2notbtn, #ht_brw #u2cards, #ht_brw #srv_info2 { display: none !important; }
/* upload settings table (parallelism, turbo, etc.): server sets the defaults;
   the script below keeps the drop button and ETA outside it */
#ht_brw #u2conf { display: none !important; }
#ht_brw #files th[name="lead"], #ht_brw #files td:first-child { display: none !important; }
#ht_brw #u2btn { font-size: 1.3em; }
#ht_brw #u2etaw { float: none !important; margin: .5em auto !important; }
</style>
<script nonce="{{ js_nonce }}">
// copyparty calls window.langmod() right after it defines its English string
// table (browser.js, just after "Ls.eng = {...}") and before the UI renders.
// This is an internal hook, not a documented option: re-check it exists when
// bumping dropzone_version. Replace colloquial strings with plain English.
window.langmod = function () {
  var s = {
    "u_nav_m": "<h6>What are you uploading?</h6><code>Enter</code> = Files (one or more)\n<code>ESC</code> = One folder (including subfolders)",
    "ul_btn": "Drop files or folders here,<br>or click to choose",
    "ul_btnu": "UPLOAD",
    "ul_idle1": "No uploads queued",
    "udt_drop": "Drop here",
    "u_asku": "Upload these {0} files to <code>{1}</code>?",
    "u_started": "Upload in progress",
    "u_fixed": "Resolved",
    "u_hs": "connecting...",
    "u_cbusy": "Waiting for the server after a network error...",
    "u_ehsdf": "The instance volume is full.\n\nFree up space, then the upload will continue.",
    "u_unpt": "",
    "u_notdir": "That is not a folder.\n\nPlease drag and drop it instead.",
    "u_ancient": "Your browser is too old for this uploader.",
    "u_nodrop": "Your browser is too old for drag-and-drop uploading.",
    "u_blankf": "These {0} files (of {1} total) are empty. Upload them anyway?\n\n",
    "u_ff_many": "On Linux, macOS or Android, this many files may crash Firefox. If that happens, try again or use Chrome.",
    "u_enpot": "switch to the <a href=\"#\">simplified interface</a> (may improve upload speed)",
    "u_depot": "switch to the <a href=\"#\">full interface</a> (may reduce upload speed)",
    "u_gotpot": "Switching to the simplified interface for faster uploads.",
    "u_emtleakc": "Try the following:\n<ul><li>press <code>F5</code> to reload the page</li><li>then try the upload again</li></ul>",
    "u_emtleakf": "Try the following:\n<ul><li>press <code>F5</code> to reload the page</li><li>then try the upload again</li></ul>",
    "utl_yolo": "unverified",
    "ue_ta": "Please try the upload again.",
    "ue_sr": "The page is in search mode. Reload it and try the upload again.",
    "ur_1un": "Upload failed",
    "ur_aun": "All {0} uploads failed",
    "ur_um": "Finished: {0} uploaded, {1} failed",
    "ur_1uo": "File uploaded",
    "ur_auo": "All {0} files uploaded",
    "xhr403": "Access denied.\n\nReload the page (F5); your session may have expired.",
    "xhr0": "The connection to the instance was lost, or the instance is offline.",
    "f_empty": "This folder is empty",
    "fd_warn1": "Delete these {0} items?",
    "fd_warn2": "This cannot be undone. Delete?",
    "fd_none": "Nothing was deleted.",
    "fc_warn": "Cut {0} items.\n\nOnly this browser tab can paste them, because the selection is very large.",
    "fcc_warn": "Copied {0} items.\n\nOnly this browser tab can paste them, because the selection is very large.",
    "mk_noname": "Type a folder name first.",
    "un_no1": "No recent uploads.",
    "un_no2": "No recent uploads match that filter.",
    "un_f5": "Something went wrong. Reload the page (F5).",
    "un_uf5": "Reload the page (F5) before aborting this upload.",
    "fu_xe2": "404: File not found",
    "mm_enet": "Your internet connection is unstable",
    "mm_edec": "This file appears to be corrupted",
    "mm_eunk": "Unknown error",
    "mt_c2ng": "Your device may not support this output format; trying anyway",
    "fz_zip8": "zip with UTF-8 filenames (may not work on Windows 7 and older)",
    "s_f1": "name contains &nbsp; (prefix a word with - to exclude it)",
    "cf_ok": "The request was blocked by rate limiting. It should resume in about 30 seconds; if not, reload the page (F5)."
  };
  for (var k in s) Ls.eng[k] = s[k];
};
(function () {
  function ready(f) { if (document.readyState !== "loading") f(); else document.addEventListener("DOMContentLoaded", f); }
  // A few messages are hard-coded outside the string table; rewrite them on the way out.
  var fixes = [
    [/y o u {3}b r o k e {4}i t/g, "Upload error"],
    [/^sorry, /, ""],
    [/^no files selected\?\?$/, "No files selected"],
    [/^thanks!$/, "Thank you"],
    [/^wtf /, ""]
  ];
  function clean(t) {
    if (typeof t !== "string") return t;
    for (var i = 0; i < fixes.length; i++) t = t.replace(fixes[i][0], fixes[i][1]);
    return t;
  }
  function wrap(obj, names) {
    if (!obj) return;
    for (var i = 0; i < names.length; i++) (function (n) {
      var f = obj[n];
      if (typeof f !== "function") return;
      obj[n] = function () {
        var a = Array.prototype.slice.call(arguments);
        for (var j = 0; j < a.length; j++) a[j] = clean(a[j]);
        return f.apply(this, a);
      };
    })(names[i]);
  }
  ready(function () {
    wrap(window.toast, ["ok", "inf", "warn", "err", "msg"]);
    wrap(window.modal, ["alert", "confirm", "prompt"]);
    var lp = document.getElementById("lp");
    if (lp) { lp.placeholder = "instance passphrase"; lp.focus(); }
    // Open the upload panel by default so the drop target and progress are visible.
    var up = document.getElementById("opa_up");
    if (up && !document.querySelector(".opview.act")) setTimeout(function () { up.click(); }, 50);
    // copyparty moves the drop button and ETA into the (hidden) settings table
    // on wide windows; keep them in the narrow-layout containers instead.
    function place() {
      var pairs = [["u2btn", "u2btn_ct"], ["u2etaw", "u2c3t"]];
      for (var i = 0; i < pairs.length; i++) {
        var el = document.getElementById(pairs[i][0]), ct = document.getElementById(pairs[i][1]);
        if (el && ct && el.parentNode !== ct) ct.appendChild(el);
      }
    }
    if (up) {
      setTimeout(place, 100); setTimeout(place, 1000);
      window.addEventListener("resize", function () { setTimeout(place, 0); });
    }
  });
})();
</script>
